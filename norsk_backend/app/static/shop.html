<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro plan – Norsk Audio</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #1d1f23; --muted: #5f6570; --border: #c9ced6;
          --accent: #2f5fd0; --error: #b3261e; --ok: #1e7a3c; --chosen: #eef3ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --card: #1d2025; --text: #e8eaed; --muted: #a0a6b0; --border: #3a3f47;
            --accent: #8fb0ff; --error: #ffb4ab; --ok: #7fd89a; --chosen: #232b3d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px 16px; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
         border-radius: 12px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; text-align: center; }
  p.lead { margin: 0 0 20px; color: var(--muted); text-align: center; font-size: .95rem; }
  .currencies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .currencies label { text-align: center; padding: 10px 4px; border: 1px solid var(--border); border-radius: 8px;
                      cursor: pointer; font-weight: 600; }
  .currencies label:has(input:checked) { border-color: var(--accent); background: var(--chosen); }
  .currencies input { position: absolute; opacity: 0; pointer-events: none; }
  .pay { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px;
         margin-top: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; cursor: pointer; }
  .pay:disabled { opacity: .45; cursor: default; }
  #vipps { background: #ff5b24; color: #fff; }
  #wallets { margin-top: 12px; }
  .note { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 4px; }
  .hidden { display: none !important; }
  #message { margin-top: 16px; min-height: 1.5em; text-align: center; }
  #message.error { color: var(--error); }
  #message.ok { color: var(--ok); }
  a.back { display: block; text-align: center; margin-top: 12px; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Pro plan</h1>
  <p class="lead" id="lead">Choose currency and how to pay.</p>
  <div id="shop">
    <div class="currencies" role="radiogroup" aria-label="Currency">
      <label><input type="radio" name="currency" value="EUR" checked>30 €</label>
      <label><input type="radio" name="currency" value="USD">$32</label>
      <label><input type="radio" name="currency" value="NOK">320 kr</label>
    </div>
    <!-- Apple Pay / Google Pay buttons, drawn by Stripe (whichever this browser supports). -->
    <div id="wallets"></div>
    <div id="wallets-note" class="note hidden">Apple Pay and Google Pay are not available in this browser.</div>
    <button id="vipps" class="pay hidden" type="button">Pay with Vipps</button>
    <div id="vipps-note" class="note hidden">Vipps takes NOK and EUR.</div>
    <a class="back" id="back" href="#">Back to plan choice</a>
  </div>
  <div id="message" role="status" aria-live="polite"></div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const ref = { candidateId: params.get('c') || '', token: params.get('t') || '' };
  const query = `c=${encodeURIComponent(ref.candidateId)}&t=${encodeURIComponent(ref.token)}`;
  document.getElementById('back').href = `../plan/?${query}`;
  const message = document.getElementById('message');
  const show = (text, kind) => { message.textContent = text; message.className = kind; };
  const post = (path, data) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                             body: JSON.stringify({ ...ref, ...data }) });
  const THANKS = 'Payment received. Thank you for registration, check your email.';
  const currency = () => document.querySelector('input[name=currency]:checked').value;
  // Where a payment provider sends the payer back to (this page, marked with the provider).
  const returnUrl = (provider) => `${location.origin}${location.pathname}?${query}&${provider}=1`;
  let busy = false;

  function finished(text) {
    document.getElementById('shop').classList.add('hidden');
    show(text, 'ok');
  }
  async function failed(response) {
    let detail = '';
    try { detail = (await response.json()).detail || ''; } catch (e) { /* not JSON */ }
    show(response.status === 409 ? 'Your registration is already complete.' : `Payment failed. ${detail}`.trim(), 'error');
  }

  // Ask the server (which asks the provider) until the payment is decided.
  async function checkPayment(provider, name) {
    show(`Checking the ${name} payment…`, '');
    for (let attempt = 0; attempt < 20; attempt++) {
      const r = await post(`../api/shop/${provider}/status`, {});
      if (!r.ok) return failed(r);
      const s = await r.json();
      if (s.paid) return finished(THANKS);
      if (!s.payment || s.payment.status !== 'processing') return show(`The ${name} payment was not completed.`, 'error');
      await new Promise((resolve) => setTimeout(resolve, 2000));
    }
    show(`The ${name} payment is still pending. Reload this page in a moment.`, 'error');
  }

  // --- Apple Pay and Google Pay, through Stripe's Express Checkout Element ---
  // Stripe.js must be loaded from js.stripe.com (Stripe's requirement for PCI compliance).
  function setupWallets(config) {
    if (!config.stripe.enabled) return;
    const script = document.createElement('script');
    script.src = 'https://js.stripe.com/v3/';
    script.onload = () => {
      const stripe = Stripe(config.stripe.publishableKey);
      const options = () => ({ amount: config.prices[currency()], currency: currency().toLowerCase() });
      const elements = stripe.elements({ mode: 'payment', paymentMethodTypes: ['card'], ...options() });
      const express = elements.create('expressCheckout', {
        paymentMethods: { link: 'never' },                // only Apple Pay / Google Pay
        buttonType: { applePay: 'buy', googlePay: 'buy' },
        buttonHeight: 48,
      });
      express.mount('#wallets');
      express.on('ready', ({ availablePaymentMethods }) => {
        if (!availablePaymentMethods) document.getElementById('wallets-note').classList.remove('hidden');
      });
      document.querySelectorAll('input[name=currency]').forEach((el) =>
        el.addEventListener('change', () => elements.update(options())));
      express.on('click', (event) => (busy ? null : event.resolve()));
      express.on('confirm', async (event) => {
        busy = true; show('Paying…', '');
        try {
          const { error: submitError } = await elements.submit();
          if (submitError) { show(submitError.message, 'error'); return; }
          const r = await post('../api/shop/stripe/start', { currency: currency() });
          if (!r.ok) { event.paymentFailed({ reason: 'fail' }); return failed(r); }
          const { clientSecret } = await r.json();
          const { error } = await stripe.confirmPayment({
            elements, clientSecret, redirect: 'if_required',  // a 3-D Secure redirect comes back with &stripe=1
            confirmParams: { return_url: returnUrl('stripe') },
          });
          if (error) return show(error.message || 'Payment failed.', 'error');
          await checkPayment('stripe', 'card');
        } catch (e) {
          show('System error, try again', 'error');
        } finally {
          busy = false;
        }
      });
    };
    document.head.appendChild(script);
  }

  // --- Vipps (direct integration: redirect to the Vipps app / landing page and back) ---
  function setupVipps(config) {
    if (!config.vipps.enabled) return;
    const button = document.getElementById('vipps');
    const note = document.getElementById('vipps-note');
    button.classList.remove('hidden'); note.classList.remove('hidden');
    const update = () => { button.disabled = !config.vipps.currencies.includes(currency()); };
    document.querySelectorAll('input[name=currency]').forEach((el) => el.addEventListener('change', update));
    update();
    button.addEventListener('click', async () => {
      if (busy) return;
      busy = true; button.disabled = true; show('Opening Vipps…', '');
      const r = await post('../api/shop/vipps/start', { currency: currency() });
      if (r.ok) { location.href = (await r.json()).redirectUrl; return; }
      busy = false; update(); failed(r);
    });
  }

  async function start() {
    const stateResponse = await fetch(`../api/plan/state?${query}`);
    if (!stateResponse.ok) {
      document.getElementById('shop').classList.add('hidden');
      return show(stateResponse.status === 403 ? 'This link is not valid.' : 'Registration not found.', 'error');
    }
    const s = await stateResponse.json();
    if (s.paid) return finished(THANKS);
    document.getElementById('lead').textContent = `Pro plan for ${s.email}. Choose currency and how to pay.`;
    const config = await (await fetch(`../api/shop/config?${query}`)).json();
    setupWallets(config); setupVipps(config);
    if (params.get('vipps')) checkPayment('vipps', 'Vipps');
    if (params.get('stripe')) {
      if (params.get('redirect_status') === 'failed') show('The card payment was not completed.', 'error');
      else checkPayment('stripe', 'card');
    }
  }
  start().catch(() => show('System error, try again', 'error'));
</script>
</body>
</html>
