<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change to Pro plan – Norsk Audio</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #1d1f23; --muted: #5f6570; --border: #c9ced6;
          --accent: #2f5fd0; --accent-text: #fff; --error: #b3261e; --ok: #1e7a3c; --chosen: #eef3ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --card: #1d2025; --text: #e8eaed; --muted: #a0a6b0; --border: #3a3f47;
            --accent: #8fb0ff; --accent-text: #0d1b3d; --error: #ffb4ab; --ok: #7fd89a; --chosen: #232b3d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px 16px; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
         border-radius: 12px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; text-align: center; }
  p.lead { margin: 0 0 20px; color: var(--muted); text-align: center; font-size: .95rem; }
  .price { font-size: 1.25rem; font-weight: 700; text-align: center; margin: 0 0 8px; }
  #pro-info { border: 1px solid var(--accent); background: var(--chosen); border-radius: 10px; padding: 4px 16px; }
  #pro-info ul { padding-left: 20px; }
  #pro-info .legal { font-size: .9rem; }
  a { color: var(--accent); }
  button { width: 100%; margin-top: 22px; padding: 12px; font: inherit; font-weight: 600; cursor: pointer;
           color: var(--accent-text); background: var(--accent); border: 0; border-radius: 8px; }
  .hidden { display: none !important; }
  #message { margin-top: 16px; min-height: 1.5em; text-align: center; }
  #message.error { color: var(--error); }
  #message.ok { color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Change to Pro plan</h1>
  <p class="lead" id="lead">&nbsp;</p>
  <div id="offer" class="hidden">
    <p class="price">30 € / $32 / 320 kr</p>
    <div id="pro-info"></div>
    <button id="buy" type="button">Buy</button>
  </div>
  <div id="message" role="status" aria-live="polite"></div>
</main>
<script src="../plan/pro-info.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const query = `u=${encodeURIComponent(params.get('u') || '')}&t=${encodeURIComponent(params.get('t') || '')}`;
  const message = document.getElementById('message');
  const show = (text, kind) => { message.textContent = text; message.className = kind; };

  async function load() {
    const r = await fetch(`../../api/plan/state?${query}`);
    if (!r.ok) {
      return show(r.status === 403 ? 'This link is not valid or has expired. Open it again from the app.'
                                   : 'User not found.', 'error');
    }
    const s = await r.json();
    document.getElementById('lead').textContent = `Signed in as ${s.email}`;
    if (!s.upgradable) return show('You already have the Pro plan.', 'ok');
    document.getElementById('offer').classList.remove('hidden');
    showProInfo(document.getElementById('pro-info'));
  }

  document.getElementById('buy').addEventListener('click', () => { location.href = `../shop/?${query}`; });
  load().catch(() => show('System error, try again', 'error'));
</script>
</body>
</html>
