name: norsk_audio_groups
description: Norwegian listening practice with group libraries and sentence repetition.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  file_picker: ^8.1.4
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0
  path: ^1.9.0
  shared_preferences: ^2.3.3
  audio_session: ^0.1.21
  web: ^1.1.1
  camera: ^0.12.2
  record: ^7.1.2
  video_player: ^2.14.1
  fc_native_video_thumbnail: ^4.0.0
  cross_file: ^0.3.5+5
  pdfrx: ^2.12.0
  url_launcher: ^6.3.3
  archive: ^4.6.0
  xml: ^7.1.0
  geolocator: ^14.0.2
  google_sign_in: ^7.2.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
